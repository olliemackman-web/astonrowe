<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<title>Aston Rowe — Construction websites that win leads</title>
<meta name="description" content="Aston Rowe builds websites for construction companies and trades that actually generate leads: calls, quote requests and booked jobs.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#020204;overflow-x:clip}
html{scroll-behavior:smooth}
body{font-family:Poppins,Inter,system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}

/* ---------- 1. fixed 1172x657 design canvas, scaled by one transform ---------- */
.stage{position:relative;min-height:100vh;overflow:hidden;background:#020204}
.canvas{position:absolute;left:50%;top:0;width:1172px;height:657px;
  /* zoom (not transform:scale) so the browser re-rasterises at the real size:
     a scale transform upsamples a 1x bitmap and makes text and cards look soft */
  transform:translateX(-50%);zoom:var(--k,1)}
.canvas>*{position:absolute}
.stack{position:absolute;inset:0;z-index:300;pointer-events:none}   /* shell only: must not block the mock's tabs */
.stack>*{position:absolute;pointer-events:auto}
.navmenu{display:contents}
.burger{display:none}

.bg{position:absolute;inset:0;
  background:
   linear-gradient(180deg, rgba(25,127,255,0) 38%, rgba(25,127,255,.042) 54%,
     rgba(25,127,255,.052) 68%, rgba(25,127,255,.030) 100%),
   #020204}
.stars{position:absolute;left:0;top:0;width:1px;height:1px;border-radius:50%;background:#fff}

/* ---------- 4. nav pill ---------- */
.nav{left:247px;top:3px;width:678px;height:64px;border-radius:32px;z-index:400;
  background:rgba(255,255,255,.008);
  border:1px solid rgba(255,255,255,.105);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  backdrop-filter:blur(16px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.mark{position:absolute;left:21px;top:19px;width:24px;height:24px;
  filter:drop-shadow(0 0 6px rgba(60,224,255,.75))}
.wm{position:absolute;left:24px;top:0;white-space:nowrap}
.wm .kick{position:absolute;left:3px;top:20px;font-size:4.4px;font-weight:600;
  letter-spacing:.10em;color:#fff;opacity:.92;line-height:1}
.wm .name{position:absolute;left:0;top:26px;transform-origin:0 50%;
  font-family:Poppins;font-weight:900;font-size:22px;line-height:1;
  letter-spacing:-.01em;word-spacing:.18em;color:#fff}
.links{position:absolute;left:156px;top:0;height:62px;transform-origin:0 50%;
  display:flex;align-items:center;gap:24px}
.links a{font-size:12.5px;font-weight:400;color:rgba(255,255,255,.92);
  white-space:nowrap;transition:opacity .25s}
.links a:hover{opacity:.65}

/* ---------- 2. PIXEL CONTRACT A: badge ---------- */
.badge{left:462px;top:95px;width:250px;height:39px;border-radius:12px;z-index:300;
  border:1px solid rgba(255,255,255,.115);
  background:linear-gradient(to top,
    rgba(190,225,255,.175) 0px, rgba(190,225,255,.128) 2px, rgba(190,225,255,.075) 4px,
    rgba(190,225,255,.026) 6px, rgba(255,255,255,.012) 9px, rgba(255,255,255,.012) 100%);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
.badge i{position:absolute;left:4px;top:4px;width:29px;height:29px;border-radius:8px;
  display:grid;place-items:center;
  background:linear-gradient(to top,
    #46afc8 0px, #35abc7 2px, #0b859d 4px, #026c84 6px, #004e66 8px,
    #053f58 10px, #012c3d 12px, #031a2a 14px, #061125 16px, #090f25 19px,
    #090c1c 23px, #060d16 29px);
  box-shadow:inset 1px 0 0 rgba(150,220,250,.40),
    inset -1px 0 0 rgba(150,220,250,.52),
    0 0 6px rgba(60,190,230,.20), 0 3px 8px -5px rgba(90,220,255,.6)}
.badge i svg{width:14px;height:16px;position:relative;top:-1px;left:0px}
.badge b{position:absolute;left:45px;transform-origin:0 50%;top:0;height:39px;
  display:flex;align-items:center;
  font-size:13px;font-weight:400;color:rgba(255,255,255,.94);white-space:nowrap;
  padding-top:1.5px}

/* ---------- 3. PIXEL CONTRACT B: glow button ---------- */
.btn{display:grid;place-items:center;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(to top,
    #9ad9ec 1px, #89dff0 2px, #79e0f1 3px, #61daef 4px, #3ec8e4 5px,
    #14a8c6 6px, #0596b3 7px, #038aa8 8px, #047796 9px, #006180 10px,
    #025066 12px, #0a4f5e 13px, #04465a 14px, #073746 16px,
    #0a2a37 18px, #0d212e 20px, #0f1824 24px, #0a121e 30px,
    #0a111d 34px, #0a111d 100%);
  box-shadow:
    inset 0 3px 3px -2px rgba(180,228,255,.10),
    inset 1px 0 0 rgba(255,255,255,.09),
    inset -1px 0 0 rgba(255,255,255,.09),
    var(--hair,0 1px 0 rgba(152,218,234,.38)),
    1px 0 0 rgba(152,218,234,.17), -1px 0 0 rgba(152,218,234,.17),
    0 0 8px rgba(60,190,235,.10),
    0 2px 5px -3px rgba(90,220,255,.45);
  transition:transform .25s,box-shadow .25s,filter .25s}
.btn::before{content:"";position:absolute;left:22%;right:38%;top:0.8px;height:1.9px;z-index:1;
  filter:blur(.55px);
  background:linear-gradient(90deg,rgba(120,225,255,0) 0%,rgba(120,225,255,.58) 34%,
    rgba(160,240,255,.74) 50%,rgba(120,225,255,.58) 66%,rgba(120,225,255,0) 100%)}
.btn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
  background:linear-gradient(90deg,rgba(200,245,255,.70),rgba(200,245,255,0) 13px),
             linear-gradient(270deg,rgba(200,245,255,.70),rgba(200,245,255,0) 13px);
  -webkit-mask:linear-gradient(to top,#000 0,#000 6px,rgba(0,0,0,.40) 12px,
    rgba(0,0,0,.15) 18px,rgba(0,0,0,.09) 24px,rgba(0,0,0,.02) 30px,rgba(0,0,0,.02) 100%);
          mask:linear-gradient(to top,#000 0,#000 6px,rgba(0,0,0,.40) 12px,
    rgba(0,0,0,.15) 18px,rgba(0,0,0,.09) 24px,rgba(0,0,0,.02) 30px,rgba(0,0,0,.02) 100%)}
.btn span{position:relative;z-index:2;display:block;line-height:1;
  text-shadow:0 1px 2px rgba(0,20,30,.5)}
.btn:hover{transform:translateY(-1px);filter:brightness(1.12);
  box-shadow:inset 0 1px 0 rgba(200,245,255,.6),inset 1px 0 0 rgba(170,225,255,.35),
             inset -1px 0 0 rgba(170,225,255,.35),0 6px 22px rgba(20,180,225,.55)}
.nav .btn{position:absolute;left:530.7px;top:10.5px;width:125.5px;height:39.5px;
  border-radius:14px;font-size:14px;font-weight:500;letter-spacing:-.005em}
.nav .btn span{margin-top:0}
.cta2{position:absolute;left:526px;top:349px;width:121px;height:54.5px;
  --hair:0 0 0 transparent;border-radius:13px;font-size:17px;font-weight:500;
  letter-spacing:-.01em;z-index:300}
.cta2::before{display:none}
.cta2 span{margin-top:0}

/* ---------- 5. hero type ---------- */
.h1{left:586px;transform:translateX(-50%);white-space:nowrap;line-height:1;
  font-family:Poppins;font-weight:900;font-size:54px;letter-spacing:-.004em;
  word-spacing:.175em;text-transform:uppercase;color:#fff;
  text-shadow:0 0 34px rgba(130,180,255,.22);z-index:300}
.sub{left:586px;transform:translateX(-50%);white-space:nowrap;line-height:1;
  font-size:13.2px;color:#a9aeb5;z-index:300}
.sub b{font-weight:600;color:#fff}
.nb{white-space:nowrap}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- 6. 3D carousel ring ---------- */
.showcase{position:absolute;left:0;top:0;width:1172px;height:0}
.ring{position:absolute;left:0;top:0;width:1172px;height:657px;z-index:5;
  perspective:891px;perspective-origin:586px 918px;transform-style:preserve-3d;
  pointer-events:none}
.card{position:absolute;left:586px;top:616px;width:130px;height:300px;
  margin:-150px 0 0 -65px;border-radius:12px;overflow:hidden;background:#0d1117;
  box-shadow:0 24px 46px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.5);
  backface-visibility:hidden;will-change:transform}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .edge{position:absolute;inset:0;border-radius:12px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.15),
             inset 0 16px 30px rgba(255,255,255,.05)}
.card.broken img{display:none}
.card img{object-position:50% 0}

/* ---------- 9. browser mock: client site switcher ---------- */
.browser{position:absolute;left:165px;top:558px;width:842px;
  height:var(--bh,99px);          /* set by JS: at least MOCK_H, or down to the fold */
  border-radius:28px 28px 0 0;overflow:hidden;z-index:100;
  box-shadow:0 -14px 44px rgba(0,0,0,.55)}
.browser::before{content:"";position:absolute;left:0;right:0;top:42px;bottom:0;
  background:rgba(20,20,26,.82);z-index:0}
.bar{position:absolute;left:0;top:0;width:100%;height:42px;
  background:linear-gradient(180deg,rgba(20,24,48,.48),rgba(15,19,38,.58));
  -webkit-backdrop-filter:blur(6px) saturate(112%);backdrop-filter:blur(6px) saturate(112%)}
.dots{position:absolute;left:27px;top:16px;display:flex;gap:2.6px}
.dots i{width:7.6px;height:7.6px;border-radius:50%}
.navbtns{position:absolute;left:70px;top:9px;display:flex;gap:3px}
.navbtns button{width:24px;height:24px;border:0;border-radius:7px;background:transparent;
  color:rgba(255,255,255,.7);display:grid;place-items:center;cursor:pointer;transition:background .2s,color .2s}
.navbtns button:hover{background:rgba(255,255,255,.08);color:#fff}
.navbtns svg{width:12px;height:12px}
.tabs{position:absolute;left:132px;right:118px;top:7px;height:28px;display:flex;gap:4px}
.tab{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:7px;padding:0 10px;border:0;border-radius:7px;
  background:rgba(255,255,255,.035);color:rgba(255,255,255,.62);font:500 10px/1 Poppins,system-ui,sans-serif;
  cursor:pointer;white-space:nowrap;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
  transition:background .2s,color .2s,box-shadow .2s}
.tab:hover{background:rgba(255,255,255,.07);color:#fff}
.tab[aria-selected=true]{background:rgba(9,13,26,.93);color:#fff;box-shadow:inset 0 0 0 1px rgba(120,225,255,.24)}
.tab:focus-visible,.navbtns button:focus-visible,.visit:focus-visible{outline:2px solid rgba(120,225,255,.7);outline-offset:1px}
.tab i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--c)}
.tab span{overflow:hidden;text-overflow:ellipsis}
.tab .s{display:none}
.visit{position:absolute;right:20px;top:7px;height:28px;display:flex;align-items:center;gap:5px;padding:0 10px;
  border-radius:7px;font-size:10px;font-weight:500;color:rgba(255,255,255,.8);transition:background .2s,color .2s}
.visit:hover{background:rgba(255,255,255,.08);color:#fff}
.visit svg{width:10px;height:10px}
.page{position:absolute;left:7px;right:6px;top:42px;bottom:0;background:#0b0d12;
  overflow:hidden;border-radius:10px 10px 0 0}
.track{display:flex;height:100%;transition:transform .55s cubic-bezier(.16,1,.3,1)}
.pane{flex:0 0 100%;height:100%;overflow-y:auto;overscroll-behavior-y:auto;touch-action:pan-y;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent}
.pane img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
/* live embeds: the iframe gets a real desktop (1440) or phone (390) viewport and is
   scaled down to the pane, so each site lays out exactly as it does for a visitor.
   The screenshot underneath shows while the live site loads. */
.pane.embed{position:relative;overflow:hidden}
.pane.embed img{position:absolute;left:0;top:0}
.pane iframe{position:absolute;left:0;top:0;border:0;background:transparent;transform-origin:0 0;
  opacity:0;transition:opacity .4s}
.pane iframe.ready{opacity:1}
@media (prefers-reduced-motion:reduce){.track{transition:none}}

/* floating WhatsApp (outside .canvas, inside .stage) */
.wa{position:fixed;right:16px;bottom:24px;width:56px;height:56px;border-radius:50%;
  background:#25d366;display:grid;place-items:center;z-index:300;
  box-shadow:0 8px 20px rgba(0,0,0,.5)}
.wa svg{width:31px;height:31px}
.wa::after{content:"";position:absolute;inset:0;border-radius:50%;
  border:2px solid rgba(37,211,102,.5);animation:pulse 2.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.75}70%{transform:scale(1.4);opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.wa::after{animation:none}}

/* ---------- 10. shared narrow-viewport nav ---------- */
@media (max-width:1080px){
  .burger{display:grid;place-content:center;gap:4px;position:absolute;right:12px;top:11px;
    width:42px;height:42px;padding:0;border:0;border-radius:14px;background:transparent;
    cursor:pointer;-webkit-tap-highlight-color:transparent}
  .burger span{display:block;width:19px;height:1.6px;border-radius:2px;
    background:rgba(255,255,255,.92);
    transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .18s}
  .burger:focus-visible{outline:2px solid rgba(120,225,255,.7);outline-offset:2px}
  .nav.open .burger span:nth-child(1){transform:translateY(5.6px) rotate(45deg)}
  .nav.open .burger span:nth-child(2){opacity:0}
  .nav.open .burger span:nth-child(3){transform:translateY(-5.6px) rotate(-45deg)}
  .navmenu{display:block;position:absolute;left:0;right:0;top:74px;padding:12px;
    border-radius:22px;border:1px solid rgba(255,255,255,.10);
    background:linear-gradient(180deg,rgba(11,15,22,.985),rgba(7,10,16,.99));
    -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 26px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);
    opacity:0;visibility:hidden;transform:translateY(-8px);
    transition:opacity .24s ease,transform .28s cubic-bezier(.4,0,.2,1),visibility .28s}
  .nav.open .navmenu{opacity:1;visibility:visible;transform:none}
  .links{position:static;display:flex;flex-direction:column;align-items:stretch;
    height:auto;gap:2px;transform:none!important}
  .links a{font-size:15px;padding:11px 14px;border-radius:12px;color:rgba(255,255,255,.9);
    transition:background .2s,color .2s}
  .nav .btn{position:static;width:100%;height:46px;margin-top:10px;font-size:15px}
  .nav .btn span{margin-top:3px}
}
@media (hover:hover) and (max-width:1080px){
  .burger:hover span{background:#fff}
  .links a:hover{background:rgba(255,255,255,.055);color:#fff;opacity:1}
}
@media (prefers-reduced-motion:reduce){.navmenu,.burger span{transition:none}}

/* ---------- tablet 701–1080 ---------- */
@media (min-width:701px) and (max-width:1080px){
  .nav{left:286px;width:620px}
  .badge{left:448px;width:277px}
  .stack{transform:translateY(var(--stshift,0px))}
  .showcase{transform:translateY(var(--sshift,0px))}
  .ring{transform:scale(var(--rs,1));transform-origin:586px 595px}
  .wa{width:58px;height:58px;right:22px;bottom:26px}
  .wa svg{width:32px;height:32px}
}

/* ---------- phone <=700: a genuine flow column ---------- */
@media (max-width:700px){
  .canvas{position:relative;left:auto;top:auto;width:100%;height:auto;min-height:100svh;transform:none;zoom:1;
    display:flex;flex-direction:column;align-items:center;padding:0 20px}
  .canvas>*{position:static}
  .stack{display:contents}
  .nav{position:relative;left:auto;top:auto;width:100%;max-width:500px;height:58px;
    margin-top:clamp(10px,1.5vh,15px);flex:0 0 auto}
  /* logo lockup: mark centre and wordmark cap centre pinned to the pill's mid */
  .mark{left:16px;top:calc(50% - 13px);width:26px;height:26px}
  .wm{left:20px;top:0;height:100%}
  .wm .kick{top:calc(50% - 15px);font-size:5px;letter-spacing:.2em}
  .wm .name{top:calc(50% - 9px);font-size:18px;transform:scaleX(.88);transform-origin:left center}
  .burger{right:8px;top:7px;width:44px;height:44px}
  .navmenu{top:68px;padding:12px}
  .links a{font-size:16px;padding:12px 15px;border-radius:12px}
  .nav .btn{height:48px;margin-top:10px;font-size:16px}
  /* auto-width badge: tile still pinned left, label kept to its RIGHT via padding */
  .badge{position:relative;left:auto;top:auto;margin-top:clamp(16px,2.6vh,26px);
    width:auto;max-width:100%;height:36px;flex:0 0 auto;border-radius:18px}
  .badge b{position:relative;left:auto;top:auto;height:36px;padding:0 15px 0 42px;font-size:12.5px}
  .badge i{top:4px;left:4px;width:28px;height:28px}
  .badge i svg{width:13px;height:19px}
  /* 7.4em sits between STREAMLINE (6.36em) and STREAMLINE THE (8.45em): the break always balances */
  .h1{position:relative;left:auto;top:auto;transform:none;white-space:normal;
    text-align:center;font-size:clamp(20px,6.6vw,36px);line-height:1.06;
    letter-spacing:-.01em;max-width:none;text-wrap:balance}
  .h1.l1{margin-top:clamp(12px,2.2vh,20px)}
  .sub{position:relative;left:auto;top:auto;transform:none;white-space:normal;
    text-align:center;font-size:clamp(14px,3.9vw,15.5px);line-height:1.5;max-width:340px}
  .sub.s1{margin-top:clamp(10px,1.8vh,16px)}
  .cta2{position:relative;left:auto;top:auto;margin-top:clamp(16px,2.6vh,26px);
    flex:0 0 auto;width:auto;min-width:158px;height:52px;padding:0 26px;font-size:16px}
  .showcase{position:relative;left:auto;top:auto;flex:0 0 auto;width:100%;height:calc(212px + min(78svh,720px))}
  /* the ring keeps its full 1172x657 3D geometry, just repositioned and clipped */
  .ring{position:absolute;left:50%;margin-left:-586px;top:-446px;bottom:auto;
    width:1172px;height:657px;transform-origin:586px 466px;transform:scale(1.02)}
  .browser{position:absolute;left:50%;transform:translateX(-50%);top:212px;bottom:0;
    width:calc(100% + 40px);height:auto;border-radius:22px 22px 0 0}
  .browser .bar{height:40px}
  .browser::before{top:40px}
  .dots,.navbtns,.visit{display:none}
  .tabs{left:10px;right:10px;top:6px}
  .tab{justify-content:center;padding:0 3px;font-size:10.5px;letter-spacing:-.01em}
  .tab i{display:none}
  .tab .l{display:none}
  .tab .s{display:inline}
  .page{top:40px}
  .wa{width:54px;height:54px;right:14px;bottom:16px}
  .wa svg{width:29px;height:29px}
}

/* ---------- 12. entrance resting states ----------
   These use the individual translate/scale/clip-path properties, NOT transform:
   transform is already owned by the type fitter and the ring loop, and the
   individual properties compose with it instead of overwriting it. */
html.intro .nav{opacity:0;translate:0 -9px}
html.intro .mark,html.intro .wm,html.intro .links a,html.intro .nav .btn,html.intro .burger{opacity:0;translate:0 6px}
html.intro .badge{opacity:0;translate:0 11px;scale:.985}
html.intro .h1{opacity:0;translate:0 15px;clip-path:inset(100% 0 -30% 0)}
html.intro .sub{opacity:0;translate:0 10px}
html.intro .cta2{opacity:0;translate:0 13px;scale:.985}
html.intro .ring{opacity:0;translate:0 18px;scale:.99}
html.intro .browser{opacity:0;translate:0 26px}
html.intro .wa{opacity:0;scale:.88}
@media (prefers-reduced-motion:reduce){
  html.intro .nav,html.intro .mark,html.intro .wm,html.intro .links a,html.intro .nav .btn,
  html.intro .burger,html.intro .badge,html.intro .h1,html.intro .sub,html.intro .cta2,
  html.intro .ring,html.intro .browser,html.intro .wa{opacity:1;translate:none;scale:none;clip-path:none}
}
</style>
<script>
document.documentElement.classList.add('intro');
setTimeout(function(){document.documentElement.classList.remove('intro');},4000);
</script>
</head>
<body>
<div class="stage">
  <div class="bg"></div>
  <div class="stars" id="stA"></div>
  <div class="stars" id="stB"></div>

  <div class="canvas" id="canvas">
    <nav class="nav" id="nav">
      <a href="#" class="wm" aria-label="Aston Rowe home"><span class="name" id="wmName">ASTON ROWE</span></a>
      <div class="navmenu" id="navmenu">
        <div class="links" id="links">
          <a href="#browser">Our work</a><a href="#why">Why it works</a><a href="#process">Process</a><a href="#faq">FAQ</a><a href="#contact">Contact</a>
        </div>
        <a href="#contact" class="btn"><span id="ctaLabel">Get a free audit</span></a>
      </div>
      <button type="button" class="burger" id="burger" aria-label="Opens menu" aria-expanded="false" aria-controls="navmenu"><span></span><span></span><span></span></button>
    </nav>

    <div class="stack">
      <div class="badge"><i><svg viewBox="5 1 14 22" preserveAspectRatio="none" aria-hidden="true"><path d="M13.9 1.6 5.5 13.6a.7.7 0 0 0 .6 1.1h4.2l-1 7.7a.7.7 0 0 0 1.25.55l8.3-12.1a.7.7 0 0 0-.6-1.1h-4.2l1-7.7a.7.7 0 0 0-1.25-.55Z" fill="rgba(16,112,152,.72)" stroke="rgba(190,236,255,.6)" stroke-width="1.6" stroke-linejoin="round"/></svg></i><b id="badgeTxt">Trusted by over 25 trades businesses</b></div>
      <h1 class="h1 l1" id="h1a">Websites that win <span class="sr">construction leads</span></h1>
      <div class="h1" id="h1b" aria-hidden="true">Construction leads</div>
      <p class="sub s1" id="sub1">Most construction websites are just online brochures.</p>
      <p class="sub" id="sub2"><b>Ours actually bring in calls, quotes and booked jobs.</b></p>
      <a href="#browser" class="btn cta2"><span id="vpLabel">See our work</span></a>
    </div>

    <div class="showcase">
      <div class="ring" id="ring"></div>
      <div class="browser" id="browser">
        <div class="bar">
          <div class="dots"><i style="background:#ee5c62"></i><i style="background:#f6b719"></i><i style="background:#12c02f"></i></div>
          <div class="navbtns">
            <button type="button" id="prevSite" aria-label="Previous client website"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
            <button type="button" id="nextSite" aria-label="Next client website"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
          </div>
          <div class="tabs" id="tabs" role="tablist" aria-label="Client websites"></div>
          <a class="visit" id="visit" href="#" target="_blank" rel="noopener">Visit site <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></a>
        </div>
        <div class="page" id="page"><div class="track" id="track"></div></div>
      </div>
    </div>
  </div>

  <a href="#" class="wa" aria-label="WhatsApp">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3.5C9.1 3.5 3.5 9 3.5 15.8c0 2.4.7 4.7 1.9 6.6L3.5 28.5l6.3-1.9c1.8 1 3.9 1.6 6.2 1.6 6.9 0 12.5-5.5 12.5-12.4S22.9 3.5 16 3.5Z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><path d="M12 9.9c-.3-.6-.6-.6-.9-.6h-.8c-.3 0-.7.1-1.1.5-.4.4-1.4 1.4-1.4 3.4s1.5 3.9 1.7 4.2c.2.3 2.9 4.6 7.1 6.3 3.5 1.4 4.2 1.1 5 1 .8-.1 2.4-1 2.8-2 .3-1 .3-1.8.2-2-.1-.2-.4-.3-.8-.5l-2.9-1.4c-.4-.1-.7-.2-.9.2-.3.4-1.1 1.4-1.3 1.6-.2.3-.5.3-.9.1-.4-.2-1.8-.7-3.4-2.1-1.3-1.1-2.1-2.5-2.4-2.9-.2-.4 0-.6.2-.8l.6-.7c.2-.2.3-.4.4-.7.1-.3.1-.5 0-.7L12 9.9Z" fill="#fff"/></svg>
  </a>
</div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var canvas=$('#canvas'), nav=$('#nav'), burger=$('#burger'), ring=$('#ring');
var RM=matchMedia('(prefers-reduced-motion: reduce)');

/* ---------- starfield: two 1px divs, each carrying its whole field as box-shadows ---------- */
function stars(el,count,blur,aMin,aMax){
  var s=[];
  for(var i=0;i<count;i++){
    s.push((Math.random()*100).toFixed(2)+'vw '+(Math.random()*100).toFixed(2)+'vh '+blur+'px 0 rgba(255,255,255,'+(aMin+Math.random()*(aMax-aMin)).toFixed(3)+')');
  }
  el.style.boxShadow=s.join(',');
}
stars($('#stA'),150,0,.05,.30);
stars($('#stB'),18,1.2,.35,.70);

/* ---------- client sites: feed both the ring cards and the browser switcher ---------- */
// embed:false = the site refuses to be framed (X-Frame-Options / frame-ancestors), so it
// falls back to a scrollable screenshot until that header is relaxed
var SITES=[
 {id:'harry',     name:'Harry James',     short:'Harry James', url:'https://harryjamesconstruction.co.uk',          embed:true,  c:'#3f8f4f', alt:'Harry James Construction website, full page'},
 {id:'render',    name:'The Render Team', short:'Render Team', url:'https://therenderteam.com',                     embed:false, c:'#f05a1a', alt:'The Render Team website, full page'},
 {id:'prime',     name:'Prime M&E',       short:'Prime',       url:'https://primemechanicalengineeringservices.com', embed:true,  c:'#e0772b', alt:'Prime Mechanical Engineering Services website, full page'},
 {id:'brightduct',name:'Brightduct',      short:'Brightduct',  url:'https://brightductinstallations.com',           embed:true,  c:'#7b5cff', alt:'Brightduct Insulation website, full page'}
];
// 8 phone screenshots (each site's hero, then its next screen), cycled round the ring
var CARDS=[];
[0,1].forEach(function(f){ SITES.forEach(function(s){ CARDS.push('images/cards/'+s.id+'-'+f+'.jpg'); }); });

/* ---------- 6. the ring ----------
   37 cards on a cylinder of radius R=891 viewed with perspective=891: the camera
   sits exactly at the ring's centre, so every card is R away and, rotated by -a,
   faces the camera square-on. The slanted top edges are pure perspective
   (perspective-origin y=918 sits below the card plane at y=616).
   step = 360/37 ≈ 9.7297°; anything beyond ±42° is culled (the back of the ring). */
var R=891, N=37, STEP=360/N, CULL=42, SPEED=1.9, cards=[];
for(var i=0;i<N;i++){
  var c=document.createElement('div');
  c.className='card';
  c.innerHTML='<img alt="" src="'+CARDS[i%CARDS.length]+'"><div class="edge"></div>';
  (function(card){card.querySelectorAll('img').forEach(function(im){
    im.addEventListener('error',function(){card.classList.add('broken')});
  })})(c);
  ring.appendChild(c); cards.push(c);
}

var phase=-2, last=null;
function placeCards(){
  for(var i=0;i<N;i++){
    var el=cards[i];
    var a=((i*STEP+phase)%360+540)%360-180;      // signed angle, -180..180
    if(Math.abs(a)>CULL){ if(el.style.visibility!=='hidden') el.style.visibility='hidden'; continue; }
    el.style.visibility='visible';
    var r=a*Math.PI/180, co=Math.cos(r);
    el.style.transform='translate3d('+(R*Math.sin(r)).toFixed(3)+'px,0,'+(R*(1-co)).toFixed(3)+'px) rotateY('+(-a).toFixed(4)+'deg)';
    el.style.filter='brightness('+(0.84+0.5*(1/co-1)).toFixed(4)+')';
  }
}
function tick(t){
  if(last===null) last=t;
  var dt=Math.min((t-last)/1000,.1); last=t;
  if(!RM.matches) phase-=SPEED*dt;               // continuous, never resets
  placeCards();
  requestAnimationFrame(tick);
}
// a backgrounded tab must not jump the ring forward when it returns
document.addEventListener('visibilitychange',function(){last=null});

/* ---------- 10. scale + responsive architecture ---------- */
var TAB_MAX=1080, TAB_MIN=701, DW_MIN=920, CW=1172;
var MOCK_H=560;   // design px: tall enough to show a client site's hero in the mock
var stage=document.querySelector('.stage');
var k=1, mobile=false, tablet=false, tboost=1;

function setMenu(open){
  nav.classList.toggle('open',open);
  burger.setAttribute('aria-expanded',open?'true':'false');
}

function resize(){
  var vw=window.innerWidth, vh=window.innerHeight;
  mobile=vw<=700; tablet=!mobile&&vw<=TAB_MAX;
  var cs=canvas.style;
  if(mobile){
    k=1; tboost=1;
    ['--k','--bh','--stshift','--sshift','--rs'].forEach(function(p){cs.removeProperty(p)});
    stage.style.height='';
  }else{
    var W=CW, ramp=0;
    if(tablet){
      // the design window narrows so type stops shrinking with the viewport;
      // at vw=1080 W is exactly 1172, so k is continuous across the breakpoint
      W=DW_MIN+(vw-TAB_MIN)*(CW-DW_MIN)/(TAB_MAX-TAB_MIN);
      if(vh>vw*1.15) W=Math.min(W,900);          // portrait tablet: tighten, read larger
      ramp=Math.min(1,(TAB_MAX-vw)/120);         // ease the architecture change in over 120px
    }
    tboost=1+0.14*ramp;                          // ink-target multiplier for type
    // k = min(vw/W, vh/560): dividing by 560 (not 657) fills the width and lets the
    // browser mock bleed off the bottom edge instead of letterboxing
    k=Math.min(vw/W, vh/560);
    var fill=Math.max(0, vh/k-657), ss=0, rs=1, st=0;
    if(tablet && fill>0){
      // share surplus height three ways: wheel + mock travel toward the foot,
      // the wheel grows (a closer camera), the hero drops to sit optically centred
      ss=Math.min(fill*0.55,420)*ramp;
      rs=1+Math.min(fill/1100,0.75)*ramp;
      var slack=219.5-125*rs+ss;
      st=Math.max(0,slack/2-28)*ramp;
      fill-=ss;                                  // the mock keeps only what is left
    }
    cs.setProperty('--k',k);
    // the mock reaches at least the fold, and is never shorter than MOCK_H; the page
    // scrolls to reveal the rest of it
    var bh=Math.max(99+fill, MOCK_H);
    cs.setProperty('--bh',bh+'px');
    stage.style.height=Math.max(vh,(558+ss+bh)*k)+'px';
    cs.setProperty('--stshift',st+'px');
    cs.setProperty('--sshift',ss+'px');
    cs.setProperty('--rs',rs);
  }
  if(!mobile && !tablet && nav.classList.contains('open')) setMenu(false);
  if(tabs.length) loadImgs();
  layout();
}

/* ---------- 11. type fitter ---------- */
var mctx=document.createElement('canvas').getContext('2d');
function fontOf(el){
  var s=getComputedStyle(el);
  return {css:s.fontStyle+' '+s.fontWeight+' '+s.fontSize+' '+s.fontFamily, size:parseFloat(s.fontSize)};
}
function inkWidth(el){ return el.getBoundingClientRect().width/(mobile?1:k); }
function capRatio(el){
  var s=getComputedStyle(el);
  mctx.font=s.fontStyle+' '+s.fontWeight+' 100px '+s.fontFamily;
  return (mctx.measureText('H').actualBoundingBoxAscent||70)/100;   // cap height per 1px of font-size
}
function fitW(el,target){
  el.style.fontSize='';
  var base=fontOf(el).size, w=inkWidth(el);
  el.style.fontSize=(base*target/w)+'px';
}
function fitNat(el,maxW,tc,pre){
  pre=pre||'';
  el.style.transform=pre;
  el.style.fontSize=(tc/capRatio(el))+'px';
  var w=inkWidth(el), sx=Math.min(1,maxW/w);
  el.style.transform=(pre+(sx<1?' scaleX('+sx+')':'')).trim();
  return w*sx;
}
function fitBox(el,tw,tc,pre){
  pre=pre||'';
  el.style.transform=pre;
  el.style.fontSize=(tc/capRatio(el))+'px';     // exact cap height
  var w=inkWidth(el);
  el.style.transform=(pre+' scaleX('+(tw/w)+')').trim();  // exact ink width
}
function baseline(el,y){
  var f=fontOf(el); mctx.font=f.css;
  var m=mctx.measureText('H');
  var A=m.fontBoundingBoxAscent||f.size*.8, D=m.fontBoundingBoxDescent||f.size*.2;
  el.style.top=(y-((f.size-(A+D))/2+A))+'px';
}
function centreLabel(btn,el,capPx){
  el.style.top='0px';
  var p=document.createElement('i');
  p.style.cssText='display:inline-block;width:0;height:0;vertical-align:baseline';
  el.appendChild(p);
  var sc=mobile?1:k, br=btn.getBoundingClientRect();
  var base=(p.getBoundingClientRect().top-br.top)/sc;
  p.remove();
  el.style.top=((br.height/sc)/2-(base-capPx/2)+1.1)+'px';   // BIAS 1.1: reference sits labels just below true centre
}

var FIT=['#h1a','#h1b','#sub1','#sub2','#badgeTxt','#wmName','#ctaLabel','#vpLabel'].map($);
function layout(){
  var links=$('#links'), as=[].slice.call(links.children);
  if(mobile){
    // hand back everything the fitter wrote, including transform, or the headline
    // stays shifted after resizing down from desktop
    FIT.forEach(function(el){el.style.fontSize='';el.style.top='';el.style.transform='';});
    [FIT[4].parentElement,FIT[7].parentElement].forEach(function(el){el.style.width='';el.style.left='';});
    links.style.fontSize=''; links.style.transform='';
    as.forEach(function(a){a.style.fontSize=''});
    placeCards(); return;
  }
  var T=tablet?tboost:1;
  var h1a=FIT[0],h1b=FIT[1],sub1=FIT[2],sub2=FIT[3],bt=FIT[4],wm=FIT[5],cl=FIT[6],vl=FIT[7];
  fitNat(h1a,700*T,37.2*T,'translateX(-50%)'); baseline(h1a,204.5);
  fitNat(h1b,700*T,37.2*T,'translateX(-50%)'); baseline(h1b,258.5);
  fitNat(sub1,560*T,8.4*T,'translateX(-50%)');  baseline(sub1,300.5);
  fitNat(sub2,560*T,8.4*T,'translateX(-50%)');  baseline(sub2,316.5);
  var bw=fitNat(bt,300*T,9.4*T,'translate(2px,-1px)'), badge=bt.parentElement;
  badge.style.width=(45+bw+16)+'px'; badge.style.left=(586-(45+bw+16)/2)+'px';
  fitNat(wm,120*T,11.4*T); baseline(wm,38.5);
  fitNat(cl,100*T,8.9*T); centreLabel(cl.parentElement,cl,8.9*T);
  var cw=fitNat(vl,180*T,9.5*T), cta=vl.parentElement;
  cta.style.width=(cw+48)+'px'; cta.style.left=(586-(cw+48)/2)+'px';
  centreLabel(cta,vl,9.5*T);
  links.style.transform='';
  as.forEach(function(a){a.style.fontSize=''});
  if(!tablet){
    var fs=7.9/capRatio(as[0]);                  // one shared size for all five links
    as.forEach(function(a){a.style.fontSize=fs+'px'});
    var rw=links.getBoundingClientRect().width/k;
    links.style.transform='scaleX('+(317/rw)+')';
  }
  placeCards();
}

/* ---------- client site switcher ---------- */
var tabsEl=$('#tabs'), track=$('#track'), visit=$('#visit'), cur=0, panes=[], tabs=[], loadAll=false;
SITES.forEach(function(s,i){
  var t=document.createElement('button');
  t.type='button'; t.className='tab'; t.id='tab-'+s.id; t.setAttribute('role','tab');
  t.setAttribute('aria-controls','pane-'+s.id); t.style.setProperty('--c',s.c);
  t.innerHTML='<i></i><span class="l">'+s.name+'</span><span class="s">'+s.short+'</span>';
  t.addEventListener('click',function(){go(i)});
  tabsEl.appendChild(t); tabs.push(t);
  var p=document.createElement('div');
  p.className='pane'; p.id='pane-'+s.id; p.setAttribute('role','tabpanel'); p.setAttribute('aria-labelledby',t.id);
  if(s.embed){
    p.classList.add('embed');
    p.innerHTML='<img alt="" draggable="false"><iframe title="'+s.name+' website (live)" referrerpolicy="no-referrer-when-downgrade"></iframe>';
    p.lastChild.addEventListener('load',function(){ if(this.getAttribute('src')) this.classList.add('ready'); });
  }else{
    p.innerHTML='<img alt="'+s.alt+'" draggable="false">';
  }
  track.appendChild(p); panes.push(p);
});
function siteSrc(i){ return 'images/sites/'+SITES[i].id+(mobile?'-m':'')+'.jpg'; }
var SITE_W_DESK=1440, SITE_W_MOB=390;
function sizeFrames(){
  panes.forEach(function(p){
    var f=p.querySelector('iframe'); if(!f) return;
    var w=mobile?SITE_W_MOB:SITE_W_DESK, sc=p.clientWidth/w;
    if(!sc) return;
    f.style.width=w+'px';
    f.style.height=(p.clientHeight/sc)+'px';
    f.style.transform='scale('+sc+')';
  });
}
function loadImgs(){
  panes.forEach(function(p,i){
    var img=p.querySelector('img'), want=siteSrc(i);
    if((i===cur||loadAll) && img.getAttribute('src')!==want){ img.src=want; if(!SITES[i].embed) p.scrollTop=0; }
    var f=p.querySelector('iframe');
    if(f && i===cur && !f.getAttribute('src')) f.src=SITES[i].url;
  });
  sizeFrames();
}
function go(i){
  cur=(i+SITES.length)%SITES.length;
  track.style.transform='translateX('+(-cur*100)+'%)';
  tabs.forEach(function(t,j){ t.setAttribute('aria-selected',j===cur?'true':'false'); t.tabIndex=j===cur?0:-1; });
  panes.forEach(function(p,j){ p.setAttribute('aria-hidden',j===cur?'false':'true'); });
  visit.href=SITES[cur].url;
  visit.setAttribute('aria-label','Visit '+SITES[cur].name+' website (opens in a new tab)');
  loadImgs();
}
$('#prevSite').addEventListener('click',function(){go(cur-1)});
$('#nextSite').addEventListener('click',function(){go(cur+1)});
tabsEl.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ e.preventDefault(); go(cur+(e.key==='ArrowRight'?1:-1)); tabs[cur].focus(); }
});
// flick: horizontal swipe / drag, or a sideways trackpad gesture
var pageEl=$('#page'), sx=null, sy=0, lastWheel=0;
pageEl.addEventListener('pointerdown',function(e){ sx=e.clientX; sy=e.clientY; });
pageEl.addEventListener('pointerup',function(e){
  if(sx===null) return;
  var dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)*1.3) go(cur+(dx<0?1:-1));
});
pageEl.addEventListener('pointercancel',function(){ sx=null; });
pageEl.addEventListener('wheel',function(e){
  if(Math.abs(e.deltaX)>Math.abs(e.deltaY) && Math.abs(e.deltaX)>25){
    var now=Date.now(); if(now-lastWheel>650){ lastWheel=now; go(cur+(e.deltaX>0?1:-1)); }
  }
},{passive:true});
window.addEventListener('load',function(){ setTimeout(function(){ loadAll=true; loadImgs(); },1200); });

/* ---------- menu ---------- */
burger.addEventListener('click',function(e){e.stopPropagation();setMenu(!nav.classList.contains('open'))});
document.addEventListener('click',function(e){ if(nav.classList.contains('open')&&!nav.contains(e.target)) setMenu(false); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&nav.classList.contains('open')){setMenu(false);burger.focus();} });
$('#navmenu').addEventListener('click',function(e){ if(e.target.closest('a')) setMenu(false); });

/* ---------- wiring ---------- */
window.addEventListener('resize',resize);
if(window.visualViewport) visualViewport.addEventListener('resize',resize);
resize();
go(0);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(layout);
setTimeout(layout,400); setTimeout(layout,1400);
requestAnimationFrame(tick);

/* ---------- 12. master entrance timeline (runs once) ---------- */
(function(){
  var H=document.documentElement;
  function settle(){
    if(document.getAnimations) document.getAnimations().forEach(function(a){
      if(String(a.id).indexOf('intro:')===0) a.cancel();
    });
    H.classList.remove('intro');
    layout();   // re-fit once nothing is mid-scale
  }
  if(!H.classList.contains('intro')||RM.matches||!Element.prototype.animate){settle();return;}
  var D=window.innerWidth<=700?.66:1;            // phones travel shorter distances
  var EXPO='cubic-bezier(.16,1,.3,1)', SOFT='cubic-bezier(.22,.61,.36,1)';
  function Y(px){return '0 '+(px*D)+'px'}
  var n=0, lastAnim=null, lastEnd=0;
  function play(el,from,dur,delay,ease){
    if(!el) return;
    var to={opacity:1};
    if('translate' in from) to.translate='0 0';
    if('scale' in from) to.scale='1';
    if('clipPath' in from) to.clipPath='inset(-30% 0 -30% 0)';
    var a=el.animate([from,to],{duration:dur,delay:delay,easing:ease,fill:'both'});
    a.id='intro:'+(n++);
    if(delay+dur>=lastEnd){lastEnd=delay+dur;lastAnim=a;}
  }
  // the frame settles
  play($('.nav'),{opacity:0,translate:Y(-9)},620,60,EXPO);
  play($('.mark'),{opacity:0,translate:Y(6)},520,150,SOFT);
  play($('.wm'),{opacity:0,translate:Y(6)},520,185,SOFT);
  document.querySelectorAll('.links a').forEach(function(a,i){play(a,{opacity:0,translate:Y(6)},460,215+i*45,SOFT)});
  play($('.burger'),{opacity:0,translate:Y(6)},460,300,SOFT);
  play($('.nav .btn'),{opacity:0,translate:Y(6)},500,400,SOFT);
  // context, then the message: headline lines wipe up out of their own baseline
  play($('.badge'),{opacity:0,translate:Y(11),scale:.985},560,270,EXPO);
  play($('#h1a'),{opacity:0,translate:Y(15),clipPath:'inset(100% 0 -30% 0)'},900,380,EXPO);
  play($('#h1b'),{opacity:0,translate:Y(15),clipPath:'inset(100% 0 -30% 0)'},900,470,EXPO);
  play($('#sub1'),{opacity:0,translate:Y(10)},620,690,EXPO);
  play($('#sub2'),{opacity:0,translate:Y(10)},620,745,EXPO);
  play($('.cta2'),{opacity:0,translate:Y(13),scale:.985},620,830,EXPO);
  // the payoff: the wheel rises into depth, then the mock lands in front of it
  play($('.ring'),{opacity:0,translate:Y(18),scale:.99},950,700,EXPO);
  play($('.browser'),{opacity:0,translate:Y(26)},900,900,EXPO);
  play($('.wa'),{opacity:0,scale:.88},500,1260,EXPO);
  if(lastAnim) lastAnim.finished.then(settle).catch(settle); else settle();
})();
})();
</script>
</body>
</html>
